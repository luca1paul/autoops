# docker-compose.yml
# Docker Compose configuration for AutoOps services
# This file defines the services required for AutoOps, including the API, Nginx, RabbitMQ, Prometheus, and Grafana.

services:
  api:
    image: ghcr.io/luca1paul/autoops-api:latest
    ports:
      - "5000:5000"
    environment:
      - ENV=development
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq
    networks:
      - autoops_net

  nginx:
    image: nginx:latest
    container_name: autoops_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - autoops_net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: autoops_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    command: >
      bash -c "rabbitmq-plugins enable --offline rabbitmq_prometheus &&
              rabbitmq-server"
    networks:
      - autoops_net

  prometheus:
    image: prom/prometheus:latest
    container_name: autoops_prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - autoops_net

  grafana:
    image: grafana/grafana:latest
    container_name: autoops_grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - autoops_net

networks:
  autoops_net:
    driver: bridge

volumes:
  grafana-data:
