# .github/workflows/ci.yml
# ansible/playbooks/deploy_autoops.yml
# Deploy latest AutoOps container
# This playbook pulls the latest AutoOps API image from GitHub Container Registry
# and deploys it on the target servers.

name: AutoOps Full Pipeline (Build → Push → Deploy → Verify → Observe)

on:
  push:
    branches: ["main"]
  pull_request: 
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build_push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/autoops-api:latest ./app/services/api

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/autoops-api:latest

  deploy_verify_observe:
    name: Deploy + Verify + Observe Metrics
    runs-on: ubuntu-latest
    needs: build_push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GHCR (pull)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # DEPLOY: bring up your stack
      - name: Deploy (Docker Compose)
        run: |
          docker compose pull
          docker compose up -d
          docker compose ps

      # VERIFY: wait for API to become healthy
      - name: Verify API health (/status)
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/status > /dev/null; then
              echo "API is healthy ✅"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done
          echo "API did not become healthy ❌"
          docker compose logs --no-color api
          exit 1

      # OBSERVE: hit the API a few times to generate metrics
      - name: Generate traffic
        run: |
          for i in {1..10}; do
            curl -fsS http://localhost:5000/status > /dev/null
          done
          echo "Traffic generated ✅"

      # OBSERVE: confirm Prometheus is scraping and metric exists
      - name: Observe metrics in Prometheus
        run: |
          # Wait for Prometheus to be ready
          for i in {1..30}; do
            if curl -s http://localhost:9090/-/ready | grep -q "Prometheus is Ready"; then
              echo "Prometheus is ready ✅"
              break
            fi
            echo "Waiting for Prometheus to start..."
            sleep 2
          done

          # Query metrics (do not fail instantly on curl)
          for i in {1..30}; do
            RESP=$(curl -s "http://localhost:9090/api/v1/query?query=sum(autoops_request_count_total)" || true)

            if echo "$RESP" | grep -q '"status":"success"' && echo "$RESP" | grep -q '"result":\['; then
              echo "Metrics observed ✅"
              echo "$RESP"
              exit 0
            fi

            echo "Waiting for Prometheus to scrape metrics..."
            sleep 2
          done

          echo "Prometheus query response:"
          echo "$RESP"

          echo "Prometheus logs:"
          docker compose logs --no-color --tail=200 prometheus

          exit 1

      # Optional: cleanup (keeps runner clean)
      - name: Teardown
        if: always()
        run: |
          docker compose down
