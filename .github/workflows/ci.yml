name: AutoOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd app/services/api
          pip install -r requirements.txt

      - name: Run basic Flask test
        run: |
          cd app/services/api
          python -m unittest discover -s tests || echo "⚠️ No tests found, continuing"

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/autoops-api:latest ./app/services/api

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}


      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/autoops-api:latest

