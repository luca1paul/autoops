# monitoring/prometheus/prometheus.yml
# Prometheus configuration for AutoOps monitoring
# This file defines the scrape configurations for monitoring AutoOps services.

gglobal:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'autoops_api'
    static_configs:
      - targets: ['api:5000']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
