# monitoring/prometheus/prometheus.yml
# Prometheus configuration for AutoOps monitoring
# This file defines the scrape configurations for monitoring AutoOps services.

global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "autoops_api"
    metrics_path: "/metrics" # Standard path for Prometheus metrics
    static_configs:
      - targets: ["api:5000"]

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "node"
    static_configs:
      - targets: ["node_exporter:9100"] # Added for system-level monitoring
      