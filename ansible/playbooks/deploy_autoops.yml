# ansible/playbooks/deploy_autoops.yml
# Deploy latest AutoOps container
# This playbook pulls the latest AutoOps API image from GitHub Container Registry
# and deploys it on the target servers.

---
- name: Deploy latest AutoOps container
  hosts: autoops_servers
  become: yes
  tasks:
    - name: Log in to GitHub Container Registry
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ lookup('env', 'GITHUB_ACTOR') }}"
        password: "{{ lookup('env', 'GHCR_PAT') }}"

    - name: Pull latest AutoOps API image
      community.docker.docker_image:
        name: ghcr.io/luca1paul/autoops-api:latest
        source: pull
        force_source: true

    - name: Stop existing AutoOps container (if any)
      community.docker.docker_container:
        name: autoops_api
        state: stopped
      ignore_errors: yes

    - name: Start new AutoOps container
      community.docker.docker_container:
        name: autoops_api
        image: ghcr.io/luca1paul/autoops-api:latest
        restart_policy: always
        ports:
          - "5000:5000"

    - name: Verify AutoOps API is running
      ansible.builtin.uri:
        url: "http://localhost:5000/status"
        return_content: yes
      register: api_health

    - name: Show API status
      ansible.builtin.debug:
        msg: "{{ api_health.content }}"
