# Ansible playbook to set up Nginx on AutoOps servers
# This playbook installs Nginx, configures a basic site, and ensures the service is running. 

---
- name: Install and configure Nginx
  hosts: autoops_servers
  become: yes
  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Copy Nginx config
      copy:
        dest: /etc/nginx/sites-available/autoops.conf
        content: |
          server {
              listen 80;
              server_name _;
              location / {
                  proxy_pass http://127.0.0.1:5000;
              }
          }

    - name: Enable site
      file:
        src: /etc/nginx/sites-available/autoops.conf
        dest: /etc/nginx/sites-enabled/autoops.conf
        state: link

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
