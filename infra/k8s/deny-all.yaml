# infra/k8s/deny-all.yaml
# Kubernetes NetworkPolicy to deny all ingress traffic in the 'autoops' namespace

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: autoops
spec:
  podSelector: {} # Matches all pods in the namespace
  policyTypes:
  - Ingress
  # Note: We are leaving 'ingress' empty, which means DENY EVERYTHING.
