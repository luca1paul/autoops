# Default values for autoops.
# This is a YAML-formatted file.

replicaCount: 2

image:
  repository: ghcr.io/luca1paul/autoops-api
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

# We don't need these yet, but keep the structure valid
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
